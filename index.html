<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HAWK Audio | Speakers, Subwoofers, Rentals and Repairs</title>
    <meta
      name="description"
      content="HAWK builds powerful speakers and subwoofers, with professional audio rentals and speaker repairs."
    />
    <meta name="author" content="HAWK Audio" />
    <link rel="icon" href="/brand/hawk-red.png" />
    <meta
      property="og:title"
      content="HAWK Audio | Speakers, Subwoofers, Rentals and Repairs"
    />
    <meta
      property="og:description"
      content="Explore HAWK speakers, subwoofers, sound equipment rentals and speaker repairs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/hawk-red.png" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/hawk-red.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
