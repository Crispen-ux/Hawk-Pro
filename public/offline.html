<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - HAWK Audio</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #0d0d0c;
        color: #f5f5f4;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      button {
        background: #ff6a1a;
        color: #0d0d0c;
        border: 0;
        padding: 0.8rem 1.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
